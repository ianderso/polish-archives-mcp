[project]
name = "polish-archives-mcp"
dynamic = ["version"]
description = "MCP server for the Polish volunteer indexes of vital records: Geneteka with its per-parish coverage list, the Poznań Project's marriages 1800-1899, and BaSIA's entries tied to archive call numbers, plus full-size scans from Szukaj w Archiwach's photo host. For genealogy."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ian Anderson" }]
keywords = ["mcp", "genealogy", "family-history", "poland", "posen", "geneteka", "basia", "poznan-project", "szukaj-w-archiwach", "vital-records"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "Natural Language :: Polish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Sociology :: Genealogy",
    "Topic :: Sociology :: History",
]
dependencies = [
    # Capped below 3: server.compact_schemas reaches into the SDK's private
    # tool registry, which a major release is free to change.
    "mcp>=2.0.0,<3",
    "httpx>=0.27,<1",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    # 0.9 is the oldest ruff whose formatter agrees with the committed style.
    "ruff>=0.9",
]

[project.urls]
Homepage = "https://github.com/ianderso/polish-archives-mcp"
Repository = "https://github.com/ianderso/polish-archives-mcp"
Issues = "https://github.com/ianderso/polish-archives-mcp/issues"
Changelog = "https://github.com/ianderso/polish-archives-mcp/blob/main/CHANGELOG.md"

[project.scripts]
polish-archives-mcp = "polish_archives_mcp.__main__:main"

[build-system]
# 1.27 is the first hatchling to accept an SPDX string for `license`.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/polish_archives_mcp/__init__.py"

[tool.hatch.build.targets.sdist]
exclude = [".github"]

[tool.hatch.build.targets.wheel]
packages = ["src/polish_archives_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "UP042"]
